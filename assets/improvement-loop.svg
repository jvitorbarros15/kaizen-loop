<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" role="img" aria-labelledby="t d"><title id="t">The improvement loop</title><desc id="d">A session is recorded and scored. A daily batch proposes a skill change. A hidden benchmark routes it to merge, review or discard. Real-use outcomes guide the next session or a revert.</desc><defs><marker id="ffae63" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6" fill="none" stroke="#ffae63" stroke-width="1.5"/></marker><marker id="82dfbe" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6" fill="none" stroke="#82dfbe" stroke-width="1.5"/></marker><marker id="93bfff" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6" fill="none" stroke="#93bfff" stroke-width="1.5"/></marker><marker id="ffa39c" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6" fill="none" stroke="#ffa39c" stroke-width="1.5"/></marker><marker id="f4f1e9" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6" fill="none" stroke="#f4f1e9" stroke-width="1.5"/></marker><marker id="c2c8cf" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L6 3L0 6" fill="none" stroke="#c2c8cf" stroke-width="1.5"/></marker></defs><style>text{font-family:system-ui,'Segoe UI',sans-serif}.pulse{animation:travel 4s linear infinite}@keyframes travel{to{stroke-dashoffset:-100}}@media(prefers-reduced-motion:reduce){.pulse{display:none}}</style><rect width="840" height="440" rx="18" fill="#161b20"/><g><path d="M262 85H294" fill="none" stroke="#ffae63" stroke-width="2" marker-end="url(#ffae63)"/><path class="pulse" d="M262 85H294" pathLength="100" fill="none" stroke="#ffae63" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 93"/>
<path d="M534 85H566" fill="none" stroke="#ffae63" stroke-width="2" marker-end="url(#ffae63)"/><path class="pulse" d="M534 85H566" pathLength="100" fill="none" stroke="#ffae63" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 93"/>
<path d="M690 132V166" fill="none" stroke="#ffae63" stroke-width="2" marker-end="url(#ffae63)"/><path class="pulse" d="M690 132V166" pathLength="100" fill="none" stroke="#ffae63" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 93"/>
<path d="M566 220H535" fill="none" stroke="#ffae63" stroke-width="2" marker-end="url(#ffae63)"/><path class="pulse" d="M566 220H535" pathLength="100" fill="none" stroke="#ffae63" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 93"/>
<path d="M300 220H265" fill="none" stroke="#82dfbe" stroke-width="2" marker-end="url(#82dfbe)"/><path class="pulse" d="M300 220H265" pathLength="100" fill="none" stroke="#82dfbe" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 93"/>
<path d="M145 272V316" fill="none" stroke="#82dfbe" stroke-width="2" marker-end="url(#82dfbe)"/><path class="pulse" d="M145 272V316" pathLength="100" fill="none" stroke="#82dfbe" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 93"/>
<path d="M262 361H296" fill="none" stroke="#ffa39c" stroke-width="2" marker-end="url(#ffa39c)"/><path class="pulse" d="M262 361H296" pathLength="100" fill="none" stroke="#ffa39c" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 93"/>
<path d="M24 361H11V85H24" fill="none" stroke="#82dfbe" stroke-width="2" marker-end="url(#82dfbe)"/><path class="pulse" d="M24 361H11V85H24" pathLength="100" fill="none" stroke="#82dfbe" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 93"/>
<g><rect x="24" y="38" width="238" height="94" rx="13" fill="#21282e" stroke="#435057"/><text x="40" y="60" fill="#ffae63" font-size="12" font-weight="700">SESSION-END HOOK</text><text x="40" y="87" fill="#f4f1e9" font-size="22" font-weight="700">Record</text><text x="40" y="113" fill="#c2c8cf" font-size="16" font-weight="500">Redact and save locally</text></g>
<g><rect x="296" y="38" width="238" height="94" rx="13" fill="#21282e" stroke="#435057"/><text x="312" y="60" fill="#ffae63" font-size="12" font-weight="700">EVIDENCE</text><text x="312" y="87" fill="#f4f1e9" font-size="22" font-weight="700">Score</text><text x="312" y="113" fill="#c2c8cf" font-size="16" font-weight="500">Tests + blind judge → ledger</text></g>
<g><rect x="568" y="38" width="248" height="94" rx="13" fill="#21282e" stroke="#435057"/><text x="584" y="60" fill="#ffae63" font-size="12" font-weight="700">DAILY BATCH</text><text x="584" y="87" fill="#f4f1e9" font-size="22" font-weight="700">Improve</text><text x="584" y="113" fill="#c2c8cf" font-size="16" font-weight="500">Rewrite one skill</text></g>
<g><rect x="568" y="169" width="248" height="103" rx="13" fill="#21282e" stroke="#435057"/><text x="584" y="191" fill="#ffae63" font-size="12" font-weight="700">BEFORE / AFTER</text><text x="584" y="218" fill="#f4f1e9" font-size="22" font-weight="700">Benchmark</text><text x="584" y="244" fill="#c2c8cf" font-size="16" font-weight="500">Hidden tests decide</text></g>
<rect x="298" y="169" width="236" height="103" rx="13" fill="#21282e" stroke="#435057"/>
<text x="314" y="193" fill="#ffae63" font-size="12" font-weight="700">BENCHMARK OUTCOME</text>
<text x="314" y="216" fill="#82dfbe" font-size="16" font-weight="500">Low risk → auto-merge</text>
<text x="314" y="238" fill="#93bfff" font-size="16" font-weight="500">Review → human approval</text>
<text x="314" y="260" fill="#ffa39c" font-size="16" font-weight="500">Fail → discard + log</text>
<g><rect x="24" y="169" width="238" height="103" rx="13" fill="#21282e" stroke="#435057"/><text x="40" y="191" fill="#82dfbe" font-size="12" font-weight="700">AFTER MERGE</text><text x="40" y="218" fill="#f4f1e9" font-size="22" font-weight="700">Watch</text><text x="40" y="244" fill="#c2c8cf" font-size="16" font-weight="500">Track real-use scores</text></g>
<g><rect x="24" y="318" width="238" height="94" rx="13" fill="#21282e" stroke="#435057"/><text x="40" y="340" fill="#82dfbe" font-size="12" font-weight="700">MONITORING</text><text x="40" y="367" fill="#f4f1e9" font-size="22" font-weight="700">Score trend</text><text x="40" y="393" fill="#c2c8cf" font-size="16" font-weight="500">Holds → next session</text></g>
<g><rect x="298" y="318" width="236" height="94" rx="13" fill="#21282e" stroke="#435057"/><text x="314" y="340" fill="#ffa39c" font-size="12" font-weight="700">IF SCORES DROP</text><text x="314" y="367" fill="#f4f1e9" font-size="22" font-weight="700">Revert</text><text x="314" y="393" fill="#c2c8cf" font-size="16" font-weight="500">Notify the maintainer</text></g></g></svg>