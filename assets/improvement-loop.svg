<svg xmlns="http://www.w3.org/2000/svg" width="840" height="334" viewBox="0 0 840 334" role="img" aria-labelledby="title desc">
  <title id="title">Improvement cycle</title>
  <desc id="desc">A session is recorded and scored. The daily batch proposes one change. A hidden benchmark routes it to merge, human review or rejection. After merge the live score determines whether to keep or revert it.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#74776e"/></marker></defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; fill: #292c29 }
    .label { font-size: 21px; font-weight: 600 }
    .body { font-size: 16px; fill: #484d47 }
    .note { font-family: Consolas, monospace; font-size: 14px; fill: #63675f }
    .line { stroke: #74776e; stroke-width: 1.4; fill: none }
    .rule { stroke: #d7d8d0 }
    .signal { animation: trace 5s linear infinite }
    @keyframes trace { to { stroke-dashoffset: -100 } }
    @media (prefers-reduced-motion: reduce) { .signal { display: none } }
  </style>
  <rect width="840" height="334" fill="#faf8f3"/>
  <path d="M64 52 V281 H33 V52 H57" class="line" marker-end="url(#arrow)"/>
  <path class="signal" d="M64 281 H33 V52 H57" pathLength="100" stroke="#cf5918" stroke-width="2.5" stroke-dasharray="4 96" fill="none"/>
  <circle cx="64" cy="52" r="4" fill="#faf8f3" stroke="#303430" stroke-width="2"/>
  <text x="86" y="57" class="label">Record</text>
  <text x="86" y="81" class="body">Session ends · redact and store locally</text>
  <circle cx="64" cy="123" r="4" fill="#faf8f3" stroke="#303430" stroke-width="2"/>
  <text x="86" y="128" class="label">Score</text>
  <text x="86" y="152" class="body">Tests and blind review → ledger</text>
  <circle cx="64" cy="194" r="4" fill="#faf8f3" stroke="#303430" stroke-width="2"/>
  <text x="86" y="199" class="label">Improve</text>
  <text x="86" y="223" class="body">Daily batch proposes one skill edit</text>
  <circle cx="64" cy="281" r="4" fill="#faf8f3" stroke="#303430" stroke-width="2"/>
  <text x="86" y="286" class="label">Watch</text>
  <text x="86" y="310" class="body">After merge, track real-use scores</text>
  <path d="M355 194 H395 V52 H424" class="line" marker-end="url(#arrow)"/>
  <path d="M432 202 V246 H362 V281 H322" class="line" marker-end="url(#arrow)"/>
  <text x="440" y="58" class="label">Benchmark</text>
  <text x="440" y="84" class="body">Compare baseline and candidate on hidden tasks.</text>
  <path class="rule" d="M440 99 H810"/>
  <text x="440" y="119" class="body">Pass · low risk</text>
  <text x="590" y="119" class="body">Open PR and auto-merge</text>
  <path class="rule" d="M440 133 H810"/>
  <text x="440" y="153" class="body">Pass · review</text>
  <text x="590" y="153" class="body">Open PR for approval</text>
  <path class="rule" d="M440 167 H810"/>
  <text x="440" y="187" class="body">Fail</text>
  <text x="590" y="187" class="body">Discard and log why</text>
  <text x="440" y="259" class="label">After release</text>
  <text x="440" y="283" class="body">Stable → continue recording</text>
  <text x="440" y="306" class="body">Regression → revert and notify</text>
</svg>