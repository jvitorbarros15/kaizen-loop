<svg xmlns="http://www.w3.org/2000/svg" width="840" height="252" viewBox="0 0 840 252" role="img" aria-labelledby="title desc">
  <title id="title">Architecture</title>
  <desc id="desc">A Claude Code session-end hook sends the transcript path into the Python core. The core parses, redacts, stores, evaluates and reports. Run JSON and SQLite stay local. An external judge receives redacted summaries only for allowlisted repositories.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="m1 1 5 3-5 3" fill="none" stroke="#74776e"/></marker></defs>
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; fill: #292c29 }
    .label { font-size: 21px; font-weight: 600 }
    .body { font-size: 16px; fill: #484d47 }
    .note { font-family: Consolas, monospace; font-size: 14px; fill: #63675f }
    .line { stroke: #74776e; stroke-width: 1.4; fill: none }
    .rule { stroke: #d7d8d0 }
    .signal { animation: trace 5s linear infinite }
    @keyframes trace { to { stroke-dashoffset: -100 } }
    @media (prefers-reduced-motion: reduce) { .signal { display: none } }
  </style>
  <rect width="840" height="252" fill="#faf8f3"/>
  <text x="30" y="44" class="label">Claude Code</text>
  <text x="30" y="71" class="body">Session-end hook</text>
  <path d="M176 49 H232" class="line" marker-end="url(#arrow)"/>
  <text x="253" y="44" class="label">Python core</text>
  <text x="253" y="71" class="body">Parse → redact → store</text>
  <text x="253" y="98" class="body">Signals → judge → score</text>
  <path d="M489 49 H559" class="line" marker-end="url(#arrow)"/>
  <text x="582" y="44" class="label">CLI report</text>
  <text x="582" y="71" class="body">Scores, usage and waste</text>
  <path d="M269 115 V151 H59 V170" class="line" marker-end="url(#arrow)"/>
  <path d="M447 115 V151 H504 V170" class="line" marker-end="url(#arrow)"/>
  <text x="40" y="197" class="label">Local storage</text>
  <text x="40" y="224" class="body">Run JSON and SQLite ledger in ~/.kaizen</text>
  <text x="482" y="197" class="label">External judge</text>
  <text x="482" y="224" class="body">Redacted summary for allowlisted repos</text>
</svg>