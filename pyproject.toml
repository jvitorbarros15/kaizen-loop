[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaizen-loop"
version = "0.1.0"
description = "Record and score coding-agent sessions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kaizen = "kaizen.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/kaizen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
